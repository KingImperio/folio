<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folio — GitHub Profile README Generator</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&f[]=recoleta@400,600,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --surface: #2A2D31;
  --surface-panel: #1E2124;
  --surface-raised: #33373D;
  --surface-input: #3A3F46;
  --accent: #D4A847;
  --accent-hover: #C49A3A;
  --accent-light: rgba(212, 168, 71, 0.12);
  --text-primary: #D4D8DC;
  --text-muted: #8A9099;
  --text-dim: #5A6068;
  --border: rgba(255, 255, 255, 0.06);
  --border-focus: rgba(212, 168, 71, 0.4);
  --error: #E05C4A;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
  --font-body: 'Satoshi', sans-serif;
  --font-display: 'Recoleta', serif;
  --font-mono: 'JetBrains Mono', monospace;
  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-lg: 20px;
  --text-xl: 24px;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.5;
  color: var(--text-primary);
  background-color: var(--surface);
  height: 100vh;
  overflow: hidden;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--spacing-sm) var(--spacing-lg);
  background: var(--surface-panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.topbar-title {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 600;
  color: var(--text-primary);
}

.topbar-actions {
  display: flex;
  gap: var(--spacing-sm);
}

.mobile-tabs {
  display: none;
  background: var(--surface-panel);
  border-bottom: 1px solid var(--border);
  padding: 0 var(--spacing-md);
}

.mobile-tab {
  flex: 1;
  padding: var(--spacing-sm) var(--spacing-md);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--text-muted);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: all 0.2s ease;
}

.mobile-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

.panel-form {
  width: 400px;
  min-width: 400px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: var(--spacing-lg);
  scrollbar-width: thin;
  scrollbar-color: var(--surface-raised) transparent;
}

.panel-form::-webkit-scrollbar {
  width: 6px;
}

.panel-form::-webkit-scrollbar-track {
  background: transparent;
}

.panel-form::-webkit-scrollbar-thumb {
  background: var(--surface-raised);
  border-radius: 3px;
}

.panel-preview {
  flex: 1;
  background: var(--surface-panel);
  overflow-y: auto;
  padding: var(--spacing-lg);
}

.section {
  margin-bottom: var(--spacing-xl);
}

.section-label {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 600;
  color: var(--accent);
  margin-bottom: var(--spacing-md);
  padding-bottom: var(--spacing-xs);
  border-bottom: 1px solid var(--border);
}

.field {
  margin-bottom: var(--spacing-md);
}

.field-label {
  display: block;
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--text-primary);
  margin-bottom: var(--spacing-xs);
}

.field-hint {
  font-size: var(--text-xs);
  color: var(--text-dim);
  margin-top: var(--spacing-xs);
}

.char-count {
  font-size: var(--text-xs);
  color: var(--text-dim);
  float: right;
}

.char-count.warn {
  color: var(--error);
}

input[type="text"],
textarea {
  width: 100%;
  padding: var(--spacing-sm) var(--spacing-md);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--text-primary);
  background: var(--surface-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

input[type="text"]:focus,
textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}

textarea {
  resize: vertical;
  min-height: 60px;
  font-family: var(--font-body);
}

.checkbox-group {
  display: flex;
  flex-wrap: wrap;
  gap: var(--spacing-sm);
}

.checkbox-item {
  display: flex;
  align-items: center;
  gap: var(--spacing-xs);
  cursor: pointer;
}

.checkbox-item input[type="checkbox"] {
  width: 16px;
  height: 16px;
  background: var(--surface-input);
  border: 1px solid var(--border);
  border-radius: 3px;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  position: relative;
  transition: all 0.2s ease;
}

.checkbox-item input[type="checkbox"]:checked {
  background: var(--accent);
  border-color: var(--accent);
}

.checkbox-item input[type="checkbox"]:checked::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 5px;
  width: 4px;
  height: 8px;
  border: solid var(--surface);
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

.checkbox-item input[type="checkbox"]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.checkbox-item label {
  font-size: var(--text-sm);
  color: var(--text-primary);
  cursor: pointer;
  user-select: none;
}

.skill-tabs {
  display: flex;
  gap: var(--spacing-xs);
  margin-bottom: var(--spacing-sm);
  flex-wrap: wrap;
}

.skill-tab {
  padding: var(--spacing-xs) var(--spacing-sm);
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--text-muted);
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s ease;
}

.skill-tab:hover {
  color: var(--text-primary);
}

.skill-tab.active {
  background: var(--accent);
  color: var(--surface);
  border-color: var(--accent);
}

.skill-tab:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.stat-toggles {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-sm);
  margin-top: var(--spacing-sm);
}

.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.toggle-label {
  font-size: var(--text-sm);
  color: var(--text-primary);
}

.toggle-switch {
  width: 40px;
  height: 22px;
  background: var(--surface-input);
  border: 1px solid var(--border);
  border-radius: 11px;
  cursor: pointer;
  position: relative;
  transition: all 0.2s ease;
}

.toggle-switch::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  background: var(--text-muted);
  border-radius: 50%;
  transition: transform 0.2s ease, background 0.2s ease;
}

.toggle-switch.on {
  background: var(--accent);
  border-color: var(--accent);
}

.toggle-switch.on::after {
  transform: translateX(18px);
  background: var(--surface);
}

.toggle-switch:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.project-card {
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--spacing-md);
  margin-bottom: var(--spacing-sm);
}

.project-card .field {
  margin-bottom: var(--spacing-sm);
}

.project-card .field:last-child {
  margin-bottom: 0;
}

.preview-content {
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  line-height: 1.6;
  color: var(--text-primary);
  white-space: pre-wrap;
  word-break: break-word;
}

.preview-content h1 {
  font-family: var(--font-body);
  font-size: var(--text-xl);
  font-weight: 700;
  margin: var(--spacing-lg) 0 var(--spacing-sm);
  color: var(--text-primary);
}

.preview-content h2 {
  font-family: var(--font-body);
  font-size: var(--text-lg);
  font-weight: 600;
  margin: var(--spacing-lg) 0 var(--spacing-sm);
  color: var(--accent);
  padding-bottom: var(--spacing-xs);
  border-bottom: 1px solid var(--border);
}

.preview-content h3 {
  font-family: var(--font-body);
  font-size: var(--text-base);
  font-weight: 600;
  margin: var(--spacing-md) 0 var(--spacing-xs);
  color: var(--text-primary);
}

.preview-content p {
  margin-bottom: var(--spacing-sm);
}

.preview-content a {
  color: var(--accent);
  text-decoration: none;
}

.preview-content a:hover {
  text-decoration: underline;
}

.preview-content img {
  max-width: 100%;
  height: auto;
  margin: var(--spacing-sm) 0;
}

.preview-content table {
  width: 100%;
  border-collapse: collapse;
  margin: var(--spacing-sm) 0;
}

.preview-content th,
.preview-content td {
  padding: var(--spacing-xs) var(--spacing-sm);
  border: 1px solid var(--border);
  text-align: left;
  font-size: var(--text-sm);
}

.preview-content th {
  background: var(--surface-raised);
  font-weight: 600;
}

.preview-content code {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  background: var(--surface-raised);
  padding: 2px 6px;
  border-radius: 3px;
}

.preview-content pre {
  background: var(--surface-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: var(--spacing-md);
  overflow-x: auto;
  margin: var(--spacing-sm) 0;
}

.preview-content pre code {
  background: none;
  padding: 0;
}

.preview-content ul,
.preview-content ol {
  margin: var(--spacing-sm) 0;
  padding-left: var(--spacing-lg);
}

.preview-content li {
  margin-bottom: var(--spacing-xs);
}

.preview-content blockquote {
  border-left: 3px solid var(--accent);
  padding-left: var(--spacing-md);
  margin: var(--spacing-sm) 0;
  color: var(--text-muted);
}

.preview-content hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: var(--spacing-lg) 0;
}

.bottombar {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--spacing-sm);
  padding: var(--spacing-sm) var(--spacing-lg);
  background: var(--surface-panel);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.btn {
  padding: var(--spacing-sm) var(--spacing-lg);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-xs);
}

.btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.btn-primary {
  background: var(--accent);
  color: var(--surface);
}

.btn-primary:hover {
  background: var(--accent-hover);
}

.btn-secondary {
  background: var(--surface-raised);
  color: var(--text-primary);
  border: 1px solid var(--border);
}

.btn-secondary:hover {
  background: var(--surface-input);
}

.btn-danger {
  background: transparent;
  color: var(--error);
  border: 1px solid var(--error);
}

.btn-danger:hover {
  background: rgba(224, 92, 74, 0.1);
}

.btn-small {
  padding: var(--spacing-xs) var(--spacing-sm);
  font-size: var(--text-xs);
}

.confirm-bar {
  display: none;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-sm);
  padding: var(--spacing-sm) var(--spacing-lg);
  background: rgba(224, 92, 74, 0.1);
  border-top: 1px solid var(--error);
}

.confirm-bar.show {
  display: flex;
}

.confirm-text {
  font-size: var(--text-sm);
  color: var(--error);
  margin-right: var(--spacing-sm);
}

@media (max-width: 768px) {
  .mobile-tabs {
    display: flex;
  }

  .main {
    flex-direction: column;
  }

  .panel-form {
    width: 100%;
    min-width: 100%;
    border-right: none;
    border-bottom: 1px solid var(--border);
  }

  .panel-preview {
    display: none;
  }

  .panel-preview.mobile-active {
    display: block;
  }

  .panel-form.mobile-hidden {
    display: none;
  }

  .topbar-title {
    font-size: var(--text-base);
  }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="topbar-title">Folio</span>
    <div class="topbar-actions">
      <button class="btn btn-danger btn-small" id="btn-reset">Reset</button>
    </div>
  </header>

  <div class="mobile-tabs">
    <button class="mobile-tab active" data-panel="form">Edit</button>
    <button class="mobile-tab" data-panel="preview">Preview</button>
  </div>

  <div class="confirm-bar" id="confirm-bar">
    <span class="confirm-text">Clear all fields?</span>
    <button class="btn btn-danger btn-small" id="confirm-yes">Yes, clear</button>
    <button class="btn btn-secondary btn-small" id="confirm-no">Cancel</button>
  </div>

  <main class="main">
    <div class="panel-form" id="panel-form">
      <!-- Header -->
      <div class="section">
        <div class="section-label">Header</div>
        <div class="field">
          <label class="field-label" for="f-name">Display name</label>
          <input type="text" id="f-name" placeholder="Jane Doe" data-key="name">
        </div>
        <div class="field">
          <label class="field-label" for="f-tagline">Tagline / one-liner <span class="char-count" id="tagline-count">0/80</span></label>
          <input type="text" id="f-tagline" placeholder="Full-stack developer & open source enthusiast" maxlength="80" data-key="tagline">
        </div>
        <div class="field">
          <label class="field-label" for="f-working">Currently working on</label>
          <input type="text" id="f-working" placeholder="A design system for web apps" data-key="working">
        </div>
        <div class="field">
          <label class="field-label" for="f-learning">Currently learning</label>
          <input type="text" id="f-learning" placeholder="Rust, WebAssembly" data-key="learning">
        </div>
        <div class="field">
          <label class="field-label">Open to</label>
          <div class="checkbox-group">
            <div class="checkbox-item">
              <input type="checkbox" id="o-freelance" data-key="openFreelance">
              <label for="o-freelance">Freelance</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="o-fulltime" data-key="openFulltime">
              <label for="o-fulltime">Full-time</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="o-collab" data-key="openCollab">
              <label for="o-collab">Collaboration</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="o-mentor" data-key="openMentor">
              <label for="o-mentor">Mentorship</label>
            </div>
          </div>
        </div>
      </div>

      <!-- Skills -->
      <div class="section">
        <div class="section-label">Skills</div>
        <div class="skill-tabs" id="skill-tabs">
          <button class="skill-tab active" data-category="languages">Languages</button>
          <button class="skill-tab" data-category="frontend">Frontend</button>
          <button class="skill-tab" data-category="backend">Backend</button>
          <button class="skill-tab" data-category="tools">Tools</button>
          <button class="skill-tab" data-category="other">Other</button>
        </div>
        <div class="field">
          <input type="text" id="f-skills" placeholder="JavaScript, Python, Go, Rust" data-key="skills">
          <div class="field-hint">Comma-separated. Renders as shields.io badges.</div>
        </div>
      </div>

      <!-- GitHub Stats -->
      <div class="section">
        <div class="section-label">GitHub Stats</div>
        <div class="field">
          <label class="field-label" for="f-username">GitHub username</label>
          <input type="text" id="f-username" placeholder="janedoe" data-key="username">
        </div>
        <div class="stat-toggles">
          <div class="toggle-row">
            <span class="toggle-label">Stats card</span>
            <button class="toggle-switch on" id="t-stats" role="switch" aria-checked="true" data-key="showStats"></button>
          </div>
          <div class="toggle-row">
            <span class="toggle-label">Top languages</span>
            <button class="toggle-switch on" id="t-langs" role="switch" aria-checked="true" data-key="showLangs"></button>
          </div>
          <div class="toggle-row">
            <span class="toggle-label">Streak stats</span>
            <button class="toggle-switch on" id="t-streak" role="switch" aria-checked="true" data-key="showStreak"></button>
          </div>
        </div>
      </div>

      <!-- Projects -->
      <div class="section">
        <div class="section-label">Projects</div>
        <div id="projects-container">
          <div class="project-card" data-project="0">
            <div class="field">
              <label class="field-label">Project name</label>
              <input type="text" placeholder="My Project" data-key="project0Name">
            </div>
            <div class="field">
              <label class="field-label">Description</label>
              <input type="text" placeholder="A short description" data-key="project0Desc">
            </div>
            <div class="field">
              <label class="field-label">Live URL (optional)</label>
              <input type="text" placeholder="https://myproject.com" data-key="project0Live">
            </div>
            <div class="field">
              <label class="field-label">Repo URL</label>
              <input type="text" placeholder="https://github.com/janedoe/myproject" data-key="project0Repo">
            </div>
          </div>
          <div class="project-card" data-project="1">
            <div class="field">
              <label class="field-label">Project name</label>
              <input type="text" placeholder="Another Project" data-key="project1Name">
            </div>
            <div class="field">
              <label class="field-label">Description</label>
              <input type="text" placeholder="A short description" data-key="project1Desc">
            </div>
            <div class="field">
              <label class="field-label">Live URL (optional)</label>
              <input type="text" placeholder="https://another.com" data-key="project1Live">
            </div>
            <div class="field">
              <label class="field-label">Repo URL</label>
              <input type="text" placeholder="https://github.com/janedoe/another" data-key="project1Repo">
            </div>
          </div>
          <div class="project-card" data-project="2">
            <div class="field">
              <label class="field-label">Project name</label>
              <input type="text" placeholder="Third Project" data-key="project2Name">
            </div>
            <div class="field">
              <label class="field-label">Description</label>
              <input type="text" placeholder="A short description" data-key="project2Desc">
            </div>
            <div class="field">
              <label class="field-label">Live URL (optional)</label>
              <input type="text" placeholder="https://third.com" data-key="project2Live">
            </div>
            <div class="field">
              <label class="field-label">Repo URL</label>
              <input type="text" placeholder="https://github.com/janedoe/third" data-key="project2Repo">
            </div>
          </div>
        </div>
      </div>

      <!-- Connect -->
      <div class="section">
        <div class="section-label">Connect</div>
        <div class="field">
          <label class="field-label" for="f-twitter">Twitter / X</label>
          <input type="text" id="f-twitter" placeholder="@janedoe" data-key="twitter">
        </div>
        <div class="field">
          <label class="field-label" for="f-linkedin">LinkedIn</label>
          <input type="text" id="f-linkedin" placeholder="https://linkedin.com/in/janedoe" data-key="linkedin">
        </div>
        <div class="field">
          <label class="field-label" for="f-portfolio">Portfolio URL</label>
          <input type="text" id="f-portfolio" placeholder="https://janedoe.dev" data-key="portfolio">
        </div>
        <div class="field">
          <label class="field-label" for="f-email">Email</label>
          <input type="text" id="f-email" placeholder="jane@example.com" data-key="email">
        </div>
      </div>

      <!-- Footer -->
      <div class="section">
        <div class="section-label">Footer</div>
        <div class="toggle-row" style="margin-bottom: var(--spacing-md)">
          <span class="toggle-label">Show visitor counter</span>
          <button class="toggle-switch on" id="t-visitors" role="switch" aria-checked="true" data-key="showVisitors"></button>
        </div>
        <div class="field">
          <label class="field-label" for="f-closing">Custom closing line</label>
          <input type="text" id="f-closing" placeholder="Thanks for visiting!" data-key="closing">
        </div>
      </div>
    </div>

    <div class="panel-preview" id="panel-preview">
      <div class="preview-content" id="preview-content"></div>
    </div>
  </main>

  <footer class="bottombar">
    <button class="btn btn-secondary" id="btn-download">Download README.md</button>
    <button class="btn btn-primary" id="btn-copy">Copy README</button>
  </footer>
</div>

<script>
(function() {
  'use strict';

  var STORAGE_KEY = 'folio-state';
  var debounceTimer = null;

  var state = {
    name: '',
    tagline: '',
    working: '',
    learning: '',
    openFreelance: false,
    openFulltime: false,
    openCollab: false,
    openMentor: false,
    skills: '',
    skillsCategory: 'languages',
    username: '',
    showStats: true,
    showLangs: true,
    showStreak: true,
    project0Name: '',
    project0Desc: '',
    project0Live: '',
    project0Repo: '',
    project1Name: '',
    project1Desc: '',
    project1Live: '',
    project1Repo: '',
    project2Name: '',
    project2Desc: '',
    project2Live: '',
    project2Repo: '',
    twitter: '',
    linkedin: '',
    portfolio: '',
    email: '',
    showVisitors: true,
    closing: ''
  };

  function loadState() {
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        var parsed = JSON.parse(saved);
        Object.keys(parsed).forEach(function(k) {
          if (state.hasOwnProperty(k)) state[k] = parsed[k];
        });
      }
    } catch(e) {}
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch(e) {}
  }

  function syncFormFromState() {
    document.querySelectorAll('[data-key]').forEach(function(el) {
      var key = el.getAttribute('data-key');
      if (!state.hasOwnProperty(key)) return;

      if (el.type === 'checkbox') {
        el.checked = state[key];
      } else if (el.classList.contains('toggle-switch')) {
        el.classList.toggle('on', state[key]);
        el.setAttribute('aria-checked', state[key]);
      } else {
        el.value = state[key];
      }
    });

    var taglineCount = document.getElementById('tagline-count');
    if (taglineCount) {
      var len = (state.tagline || '').length;
      taglineCount.textContent = len + '/80';
      taglineCount.classList.toggle('warn', len >= 75);
    }

    var skillTabs = document.querySelectorAll('.skill-tab');
    skillTabs.forEach(function(tab) {
      tab.classList.toggle('active', tab.getAttribute('data-category') === state.skillsCategory);
    });

    updateSkillInput();
  }

  function updateSkillInput() {
    var skillsInput = document.getElementById('f-skills');
    var key = 'skills_' + state.skillsCategory;
    skillsInput.setAttribute('data-key', key);
    skillsInput.value = state[key] || '';
  }

  function readFormToState() {
    document.querySelectorAll('[data-key]').forEach(function(el) {
      var key = el.getAttribute('data-key');
      if (!state.hasOwnProperty(key)) return;

      if (el.type === 'checkbox') {
        state[key] = el.checked;
      } else if (el.classList.contains('toggle-switch')) {
        state[key] = el.classList.contains('on');
      } else {
        state[key] = el.value;
      }
    });
  }

  function generateMarkdown() {
    var lines = [];

    if (state.name) {
      lines.push('# Hi, I\'m ' + state.name + ' 👋');
      lines.push('');
    }

    if (state.tagline) {
      lines.push(state.tagline);
      lines.push('');
    }

    if (state.working || state.learning || state.openFreelance || state.openFulltime || state.openCollab || state.openMentor) {
      lines.push('## About');
      lines.push('');
      if (state.working) {
        lines.push('- 🔭 I\'m currently working on **' + state.working + '**');
      }
      if (state.learning) {
        lines.push('- 🌱 I\'m currently learning **' + state.learning + '**');
      }
      var open = [];
      if (state.openFreelance) open.push('Freelance');
      if (state.openFulltime) open.push('Full-time');
      if (state.openCollab) open.push('Collaboration');
      if (state.openMentor) open.push('Mentorship');
      if (open.length > 0) {
        lines.push('- 💼 Open to: ' + open.join(' · '));
      }
      lines.push('');
    }

    var skillCategories = ['languages', 'frontend', 'backend', 'tools', 'other'];
    var skillLabels = { languages: 'Languages', frontend: 'Frontend', backend: 'Backend', tools: 'Tools', other: 'Other' };
    var hasSkills = skillCategories.some(function(cat) {
      return state['skills_' + cat] && state['skills_' + cat].trim();
    });

    if (hasSkills) {
      lines.push('## Skills');
      lines.push('');
      skillCategories.forEach(function(cat) {
        var skillsStr = state['skills_' + cat];
        if (!skillsStr || !skillsStr.trim()) return;
        var skills = skillsStr.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
        if (skills.length === 0) return;
        var badges = skills.map(function(skill) {
          var slug = skill.toLowerCase().replace(/[^a-z0-9+#.]/g, '').replace('++', 'p');
          return '![' + skill + '](https://img.shields.io/badge/-2A2D31?style=flat-square&label=' + encodeURIComponent(skill) + '&labelColor=2A2D31&color=D4A847)';
        });
        lines.push('**' + skillLabels[cat] + '**');
        lines.push('');
        lines.push(badges.join(' '));
        lines.push('');
      });
    }

    if (state.username) {
      lines.push('## GitHub Stats');
      lines.push('');
      if (state.showStats) {
        lines.push('![GitHub Stats](https://github-readme-stats.vercel.app/api?username=' + state.username + '&show_icons=true&theme=radical&hide_border=true)');
        lines.push('');
      }
      if (state.showLangs) {
        lines.push('![Top Languages](https://github-readme-stats.vercel.app/api/top-langs/?username=' + state.username + '&layout=compact&theme=radical&hide_border=true)');
        lines.push('');
      }
      if (state.showStreak) {
        lines.push('![GitHub Streak](https://github-readme-streak-stats.herokuapp.com/?user=' + state.username + '&theme=radical&hide_border=true)');
        lines.push('');
      }
    }

    var hasProjects = [0, 1, 2].some(function(i) {
      return state['project' + i + 'Name'];
    });

    if (hasProjects) {
      lines.push('## Projects');
      lines.push('');
      lines.push('| Project | Description | Link |');
      lines.push('| ------- | ----------- | ---- |');
      [0, 1, 2].forEach(function(i) {
        var name = state['project' + i + 'Name'];
        if (!name) return;
        var desc = state['project' + i + 'Desc'] || '';
        var live = state['project' + i + 'Live'];
        var repo = state['project' + i + 'Repo'];
        var link = '';
        if (repo) link = '[Repo](' + repo + ')';
        if (live) {
          if (link) link += ' · ';
          link += '[Live](' + live + ')';
        }
        lines.push('| **' + name + '** | ' + desc + ' | ' + link + ' |');
      });
      lines.push('');
    }

    var hasConnect = state.twitter || state.linkedin || state.portfolio || state.email;
    if (hasConnect) {
      lines.push('## Connect');
      lines.push('');
      var links = [];
      if (state.twitter) links.push('[Twitter](' + (state.twitter.startsWith('http') ? state.twitter : 'https://x.com/' + state.twitter.replace('@', '')) + ')');
      if (state.linkedin) links.push('[LinkedIn](' + (state.linkedin.startsWith('http') ? state.linkedin : 'https://linkedin.com/in/' + state.linkedin) + ')');
      if (state.portfolio) links.push('[Portfolio](' + (state.portfolio.startsWith('http') ? state.portfolio : 'https://' + state.portfolio) + ')');
      if (state.email) links.push('[Email](mailto:' + state.email + ')');
      lines.push(links.join(' · '));
      lines.push('');
    }

    if (state.showVisitors || state.closing) {
      lines.push('---');
      lines.push('');
      if (state.showVisitors && state.username) {
        lines.push('![Profile Views](https://komarev.com/ghpvc/?username=' + state.username + '&color=D4A847&style=flat-square)');
        lines.push('');
      }
      if (state.closing) {
        lines.push(state.closing);
        lines.push('');
      }
    }

    return lines.join('\n');
  }

  function renderPreview(md) {
    var html = simpleMarkdown(md);
    document.getElementById('preview-content').innerHTML = html;
  }

  function simpleMarkdown(md) {
    var html = md;

    html = html.replace(/^```([\s\S]*?)```/gm, function(m, code) {
      return '<pre><code>' + escapeHtml(code.trim()) + '</code></pre>';
    });

    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

    html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

    html = html.replace(/^---$/gm, '<hr>');

    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

    html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

    html = html.replace(/^\| (.+)$/gm, function(match) {
      return '<tr>' + match.split('|').filter(function(c) { return c.trim(); }).map(function(c) {
        return '<td>' + c.trim() + '</td>';
      }).join('') + '</tr>';
    });

    html = html.replace(/(<tr>[\s\S]*?<\/tr>)/g, function(block) {
      var rows = block.split('\n').filter(function(r) { return r.trim(); });
      if (rows.length < 2) return block;
      var header = rows[0].replace(/<td>/g, '<th>').replace(/<\/td>/g, '</th>');
      var sep = rows[1];
      var body = rows.slice(2).join('\n');
      return '<table>' + header + '</table>\n' + body;
    });

    html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>[\s\S]*?<\/li>)/g, function(block) {
      return '<ul>' + block + '</ul>';
    });
    html = html.replace(/<\/ul>\n<ul>/g, '\n');

    html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');

    html = html.replace(/\n\n+/g, '\n\n');
    var paragraphs = html.split('\n\n');
    html = paragraphs.map(function(p) {
      p = p.trim();
      if (!p) return '';
      if (/^<[huptblod]/.test(p) || /^<hr/.test(p) || /^<img/.test(p)) return p;
      return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
    }).join('\n');

    return html;
  }

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function debounce() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function() {
      readFormToState();
      saveState();
      renderPreview(generateMarkdown());
    }, 150);
  }

  function copyToClipboard(text, btn) {
    navigator.clipboard.writeText(text).then(function() {
      var original = btn.textContent;
      btn.textContent = 'Copied.';
      setTimeout(function() { btn.textContent = original; }, 1500);
    }).catch(function() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      var original = btn.textContent;
      btn.textContent = 'Copied.';
      setTimeout(function() { btn.textContent = original; }, 1500);
    });
  }

  function downloadFile(filename, content) {
    var blob = new Blob([content], { type: 'text/markdown' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function init() {
    loadState();
    syncFormFromState();
    renderPreview(generateMarkdown());

    document.querySelectorAll('[data-key]').forEach(function(el) {
      var events = ['input', 'change'];
      events.forEach(function(evt) {
        el.addEventListener(evt, debounce);
      });
    });

    document.querySelectorAll('.toggle-switch[data-key]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        this.classList.toggle('on');
        var isOn = this.classList.contains('on');
        this.setAttribute('aria-checked', isOn);
        state[this.getAttribute('data-key')] = isOn;
        debounce();
      });
    });

    document.querySelectorAll('.skill-tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.skill-tab').forEach(function(t) { t.classList.remove('active'); });
        this.classList.add('active');
        var prevKey = 'skills_' + state.skillsCategory;
        state[prevKey] = document.getElementById('f-skills').value;
        state.skillsCategory = this.getAttribute('data-category');
        updateSkillInput();
      });
    });

    document.getElementById('f-tagline').addEventListener('input', function() {
      var len = this.value.length;
      var counter = document.getElementById('tagline-count');
      counter.textContent = len + '/80';
      counter.classList.toggle('warn', len >= 75);
    });

    document.getElementById('btn-copy').addEventListener('click', function() {
      copyToClipboard(generateMarkdown(), this);
    });

    document.getElementById('btn-download').addEventListener('click', function() {
      downloadFile('README.md', generateMarkdown());
    });

    document.getElementById('btn-reset').addEventListener('click', function() {
      document.getElementById('confirm-bar').classList.add('show');
    });

    document.getElementById('confirm-yes').addEventListener('click', function() {
      document.getElementById('confirm-bar').classList.remove('show');
      Object.keys(state).forEach(function(k) {
        if (typeof state[k] === 'boolean') state[k] = false;
        else if (k === 'skillsCategory') state[k] = 'languages';
        else state[k] = '';
      });
      state.showStats = true;
      state.showLangs = true;
      state.showStreak = true;
      state.showVisitors = true;
      saveState();
      syncFormFromState();
      renderPreview(generateMarkdown());
    });

    document.getElementById('confirm-no').addEventListener('click', function() {
      document.getElementById('confirm-bar').classList.remove('show');
    });

    document.querySelectorAll('.mobile-tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.mobile-tab').forEach(function(t) { t.classList.remove('active'); });
        this.classList.add('active');
        var panel = this.getAttribute('data-panel');
        document.getElementById('panel-form').classList.toggle('mobile-hidden', panel === 'preview');
        document.getElementById('panel-preview').classList.toggle('mobile-active', panel === 'preview');
      });
    });
  }

  init();
})();
</script>
</body>
</html>
